<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة اعتماد التقارير | @mohdasiri99</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --primary-color: #27ae60;
            --dark-blue: #2c3e50;
            --light-bg: #f4f7f6;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--light-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .upload-card {
            background: var(--white);
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-top: 8px solid var(--primary-color);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--dark-blue);
            font-size: 24px;
            margin-bottom: 8px;
        }

        header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            font-weight: 700;
            color: var(--dark-blue);
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Tajawal';
            transition: 0.3s;
            background: #fafafa;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            outline: none;
            background: #fff;
        }

        .drop-zone {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #f9fdfb;
            margin-bottom: 25px;
        }

        .drop-zone:hover {
            background: #eef9f2;
            border-style: solid;
        }

        .drop-zone i {
            font-size: 45px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .drop-zone p {
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }

        .btn-submit {
            background-color: #25d366;
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-submit:hover {
            background-color: #1ebe57;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .social-link {
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .social-link:hover {
            color: #1da1f2;
        }

        #file-name {
            margin-top: 10px;
            font-size: 12px;
            color: var(--primary-color);
            display: none;
        }
    </style>
</head>
<body>

<div class="upload-card">
    <header>
        <h1><i class="fas fa-file-signature"></i> بوابة اعتماد التقارير</h1>
        <p>بإشراف خبير التدريب: محمد علي عسيري</p>
    </header>

    <div class="form-group">
        <label>اسم المعلم / المتدرب</label>
        <input type="text" id="traineeName" placeholder="أدخل اسمك الثلاثي">
    </div>

    <div class="form-group">
        <label>عنوان المبادرة أو البرنامج</label>
        <input type="text" id="programTitle" placeholder="مثلاً: مبادرة الفهم القرائي">
    </div>

    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-file-pdf"></i>
        <p id="dropText">اضغط هنا لاختيار ملف التقرير (PDF)</p>
        <span id="file-name"></span>
        <input type="file" id="fileInput" hidden accept=".pdf" onchange="showFileName()">
    </div>

    <button onclick="handleSubmission()" class="btn-submit">
        <i class="fab fa-whatsapp"></i> رفع التقرير والارسال للمراجعة
    </button>

    <footer>
        <p style="font-size: 12px; color: #999; margin-bottom: 10px;">جميع الحقوق محفوظة</p>
        <a href="https://x.com/mohdasiri99" target="_blank" class="social-link">
            <i class="fab fa-x-twitter"></i> @mohdasiri99
        </a>
    </footer>
</div>

<script>
    function showFileName() {
        const input = document.getElementById('fileInput');
        const text = document.getElementById('dropText');
        const nameDisplay = document.getElementById('file-name');
        
        if (input.files.length > 0) {
            text.innerText = "تم اختيار الملف بنجاح";
            nameDisplay.innerText = input.files[0].name;
            nameDisplay.style.display = "block";
        }
    }

    function handleSubmission() {
        const name = document.getElementById('traineeName').value;
        const program = document.getElementById('programTitle').value;
        const file = document.getElementById('fileInput').files.length;

        if (!name || !program || file === 0) {
            alert("فضلاً، أكمل البيانات واختر ملف التقرير قبل الإرسال.");
            return;
        }

        const msg = `أهلاً كوتش محمد عسيري،\n\nتم رفع تقرير جديد للمراجعة:\n- المرسل: ${name}\n- البرنامج: ${program}\n\nيرجى مراجعة الرابط واعتماد التقرير.`;
        
        const url = `https://wa.me/966500535378?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
